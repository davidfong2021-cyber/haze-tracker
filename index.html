<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
           align-items: center; justify-content: center; background: #eaf6ff;
           font-family: system-ui, sans-serif; }
    h1 { color: #2d5a3d; margin: 0 0 8px; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <svg width="260" height="360" viewBox="0 0 260 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A purple flower">
    <!-- stem -->
    <path d="M130 170 C125 230 135 290 130 350" stroke="#3a8a4f" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M131 275 C170 245 205 255 215 275 C185 295 150 292 131 275Z" fill="#4caf63"/>
    <path d="M129 300 C90 270 55 280 45 300 C75 320 110 317 129 300Z" fill="#4caf63"/>
    <!-- petals -->
    <g transform="translate(130 110)" fill="#a56bff" stroke="#6f3bc4" stroke-width="2">
      <ellipse cx="0" cy="-45" rx="22" ry="40"/>
      <ellipse cx="0" cy="-45" rx="22" ry="40" transform="rotate(45)"/>
      <ellipse cx="0" cy="-45" rx="22" ry="40" transform="rotate(90)"/>
      <ellipse cx="0" cy="-45" rx="22" ry="40" transform="rotate(135)"/>
      <ellipse cx="0" cy="-45" rx="22" ry="40" transform="rotate(180)"/>
      <ellipse cx="0" cy="-45" rx="22" ry="40" transform="rotate(225)"/>
      <ellipse cx="0" cy="-45" rx="22" ry="40" transform="rotate(270)"/>
      <ellipse cx="0" cy="-45" rx="22" ry="40" transform="rotate(315)"/>
    </g>
    <!-- center -->
    <circle cx="130" cy="110" r="24" fill="#ffd23f" stroke="#e0a800" stroke-width="3"/>
  </svg>
</body>
</html>
